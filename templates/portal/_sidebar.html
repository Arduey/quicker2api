<aside class="sidebar">
  <div class="brand">
    <span class="dot">P</span>
    <span class="truncate">{{ site_name }}</span>
  </div>

  <div class="nav-label">我的</div>
  <a href="/u" class="{{ 'active' if request.path in ['/u', '/u/'] }}">
    <span class="i">◉</span> 概览
  </a>
  <a href="/u/apis" class="{{ 'active' if request.path.startswith('/u/apis') }}">
    <span class="i">⌘</span> 可用接口
  </a>
  <a href="/u/logs" class="{{ 'active' if request.path.startswith('/u/logs') }}">
    <span class="i">≣</span> 调用记录
  </a>
  <a href="/u/redeem" class="{{ 'active' if request.path.startswith('/u/redeem') }}">
    <span class="i">▦</span> 卡密兑换
  </a>

  <div class="nav-label">账号</div>
  <a href="/u/profile" class="{{ 'active' if request.path.startswith('/u/profile') }}">
    <span class="i">⚙</span> 账号设置
  </a>

  <div class="spacer"></div>
  <div class="foot">
    <div class="truncate" style="color:#8b8375">{{ current_user.email }}</div>
    <div style="color:#e8e2d5;font-weight:700;margin-top:4px">{{ current_user.points }} 积分</div>
    <form method="post" action="/logout" style="margin-top:6px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="btn ghost sm" type="submit" style="color:#b9b1a2;padding-left:0">退出登录</button>
    </form>
  </div>
</aside>
