<aside class="sidebar">
  <div class="brand">
    <span class="dot">P</span>
    <span class="truncate">{{ site_name }}</span>
  </div>

  <div class="nav-label">运营</div>
  <a href="/admin" class="{{ 'active' if request.path == '/admin' or request.path == '/admin/' }}">
    <span class="i">◉</span> 概览
  </a>
  <a href="/admin/apis" class="{{ 'active' if request.path.startswith('/admin/apis') }}">
    <span class="i">⌘</span> API 管理
  </a>
  <a href="/admin/users" class="{{ 'active' if request.path.startswith('/admin/users') }}">
    <span class="i">☺</span> 用户管理
  </a>
  <a href="/admin/cards" class="{{ 'active' if request.path.startswith('/admin/cards') }}">
    <span class="i">▦</span> 卡密充值
  </a>
  <a href="/admin/logs" class="{{ 'active' if request.path.startswith('/admin/logs') }}">
    <span class="i">≣</span> 调用日志
  </a>

  <div class="nav-label">系统</div>
  <a href="/admin/settings" class="{{ 'active' if request.path.startswith('/admin/settings') }}">
    <span class="i">⚙</span> 全局设置
  </a>
  <a href="/u"><span class="i">↗</span> 用户中心</a>

  <div class="spacer"></div>
  <div class="foot">
    <div class="truncate" style="color:#8b8375">{{ current_admin.email }}</div>
    <form method="post" action="/admin/logout" style="margin-top:6px">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="btn ghost sm" type="submit" style="color:#b9b1a2;padding-left:0">退出登录</button>
    </form>
  </div>
</aside>
